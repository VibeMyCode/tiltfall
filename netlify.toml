# Netlify: static site from dist/, the API as functions. The handlers live in
# api/ (plain Request → Response); netlify/functions/ holds the one-line
# adapters that route a path to them. Headers (CSP, immutable assets) are in
# public/_headers, which Vite copies into dist/.
[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The Netlify subdomain never redirects on its own (only www <-> apex do), so
# every old link — forum, Reddit, itch, YouTube — is sent to the real domain
# here. Query strings survive, so ?src= attribution still lands. The bot
# webhook and BotFather already point at tiltfall.com; Telegram would not
# have followed this redirect.
[[redirects]]
  from = "https://tiltfall.netlify.app/*"
  to = "https://tiltfall.com/:splat"
  status = 301
  force = true
