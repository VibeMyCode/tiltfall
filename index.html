<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1020" />

    <!-- X and Telegram both build their link preview from these. The image
         cannot be attached to an intent URL, so the card IS the image. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TILTFALL" />
    <meta property="og:title" content="TILTFALL" />
    <meta
      property="og:description"
      content="Steer a falling ball down an endless tower. Smash blocks for combos, dodge the mines."
    />
    <meta property="og:url" content="https://tiltfall.vercel.app/" />
    <meta property="og:image" content="https://tiltfall.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TILTFALL" />
    <meta
      name="twitter:description"
      content="Steer a falling ball down an endless tower. Smash blocks for combos, dodge the mines."
    />
    <meta name="twitter:image" content="https://tiltfall.vercel.app/og.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TILTFALL" />
    <meta name="description" content="Steer the falling ball, smash everything, dodge the mines." />
    <title>TILTFALL</title>
    <!-- Telegram Mini App SDK (no-op outside Telegram) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
