<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="TILTFALL">
  <!-- Full-bleed square with no corner radius: the manifest declares this icon
       maskable, so the OS cuts its own shape and anything rounded here would be
       rounded twice. The ball and its streak carry the mark and stay inside the
       centre 80% (r≈205 from 256,256) that a maskable safe zone guarantees; the
       block row deliberately runs off both edges, so cropping it reads as the
       row continuing rather than as damage.

       At 16px only the ball and streak survive, which is the whole design: the
       row is detail that pays off large. Blocks keep clear of the ball on both
       sides - touching it made them read as wings rather than as a row being
       punched through. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1259"/>
      <stop offset="1" stop-color="#6a2ba6"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ae6ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#dff8ff" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="orb" x1="0.25" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e8faff"/>
      <stop offset="1" stop-color="#6cc9f5"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#sky)"/>

  <path d="M224 44 L288 44 L302 268 L210 268 Z" fill="url(#trail)"/>

  <g>
    <rect x="-12" y="240" width="92" height="60" rx="12" fill="#ff6b5c"/>
    <rect x="94" y="240" width="56" height="60" rx="12" fill="#ffd166"/>
    <rect x="362" y="240" width="56" height="60" rx="12" fill="#38bdf8"/>
    <rect x="432" y="240" width="92" height="60" rx="12" fill="#ff6b5c"/>
  </g>

  <g fill="#ffd166">
    <rect x="128" y="356" width="44" height="44" rx="9" transform="rotate(24 150 378)"/>
    <rect x="348" y="368" width="34" height="34" rx="7" transform="rotate(-30 365 385)"/>
  </g>
  <rect x="238" y="392" width="28" height="28" rx="6" fill="#38bdf8" transform="rotate(16 252 406)"/>

  <circle cx="256" cy="268" r="84" fill="url(#orb)"/>
  <circle cx="230" cy="242" r="24" fill="#ffffff"/>
</svg>
